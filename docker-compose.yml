# Full stack: PostgreSQL + Spring Boot API + React app served by nginx.
# Usage:  cp .env.example .env   (then set JWT_SECRET)   &&   docker compose up --build
# App: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: applytrack
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applytrack}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack -d applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/applytrack
      DATABASE_USERNAME: applytrack
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-applytrack}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      # Demo account off by default; set SEED_DEMO_DATA=true in .env for a local demo
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8081"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
