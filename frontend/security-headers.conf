# Security headers, included by every location in nginx.conf that sets its own add_header
# (nginx does not inherit add_header into a location that declares one).
#
# CSP: only our own scripts; styles from us, Google Fonts and inline style attributes (React/Recharts
# set styles at runtime); API calls only to our own origin; the app may not be framed by anyone.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Legacy equivalent of frame-ancestors 'none' for old browsers
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
