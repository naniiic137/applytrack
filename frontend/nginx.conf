server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSP, nosniff, Referrer-Policy, frame-ancestors... (see security-headers.conf)
    include /etc/nginx/snippets/security-headers.conf;

    # API requests go to the Spring Boot container (same origin for the browser, so no CORS needed)
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the edge proxy: overwrite (do not append to) whatever the client sent,
        # so the backend rate limit cannot be dodged with a forged X-Forwarded-For
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness/readiness summary only ({"status":"UP"}), for uptime checks and the CI smoke test
    location = /actuator/health {
        proxy_pass http://backend:8081/actuator/health;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
