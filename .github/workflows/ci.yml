name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # H2 tests plus PostgresIntegrationTest (Testcontainers, the runner has Docker); JaCoCo report
      - name: Run tests
        run: ./mvnw -B test
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { missed += $8; covered += $9 } END {
            printf "### Backend line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with generated secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SEED_DEMO_DATA=false"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
