name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # H2 tests plus PostgresIntegrationTest (Testcontainers, the runner has Docker); JaCoCo report
      - name: Run tests
        run: ./mvnw -B test
      # Testcontainers skips these tests when Docker is missing; in CI that would hide a problem, so fail instead
      - name: Check the PostgreSQL tests ran
        run: |
          report=target/surefire-reports/TEST-dev.hamza.applytrack.PostgresIntegrationTest.xml
          grep -q 'skipped="0"' "$report" && grep -q 'failures="0"' "$report" && grep -q 'errors="0"' "$report" \
            || { echo "::error::PostgresIntegrationTest was skipped or failed"; exit 1; }
      - name: Test and coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          sum() {
            grep -ho '<testsuite [^>]*' target/surefire-reports/TEST-*.xml | grep -o " $1=\"[0-9]*\"" \
              | grep -o '[0-9]*' | awk '{ s += $1 } END { print s }'
          }
          tests=$(sum tests)
          skipped=$(sum skipped)
          line=$(awk -F, 'NR > 1 { missed += $8; covered += $9 } END {
            printf "%.1f%% line coverage (%d of %d lines)", 100 * covered / (missed + covered), covered, missed + covered
          }' "$csv")
          echo "### Backend: $tests tests ($skipped skipped), $line" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Backend tests::$tests tests ($skipped skipped), $line"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with generated secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SEED_DEMO_DATA=false"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
