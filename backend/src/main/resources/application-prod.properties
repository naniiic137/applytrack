# Production: PostgreSQL configured through environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/applytrack}
spring.datasource.username=${DATABASE_USERNAME:applytrack}
spring.datasource.password=${DATABASE_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.seed.enabled=${SEED_DEMO_DATA:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
