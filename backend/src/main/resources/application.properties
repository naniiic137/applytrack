spring.application.name=applytrack
spring.profiles.default=dev

server.port=${PORT:8081}
server.error.include-message=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Load tags / interviews for a whole page in a few IN-queries instead of one query per row (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.data.web.pageable.max-page-size=200

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true
# API messages (incl. validation errors) are always English, whatever the JVM or browser locale
spring.web.locale=en
spring.web.locale-resolver=fixed

# JWT - secret must be a Base64-encoded key of at least 256 bits
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT24H

# Failed logins allowed per account / per client IP within the window (then 429 + Retry-After)
app.auth.login-rate-limit.max-failures-per-email=5
app.auth.login-rate-limit.max-failures-per-ip=20
app.auth.login-rate-limit.window=PT15M

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5181,http://localhost:5173}
app.seed.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
